<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4 X 4 Tourism &amp; Entertainment — Digital Menu</title>
  <style>
    body { margin:0; background:#062B50; color:#fff; font-family:system-ui,-apple-system,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center; padding:20px; }
    .ring { width:44px; height:44px; border:4px solid rgba(230,134,36,0.28); border-top-color:#E68624; border-radius:50%; animation:spin 0.75s linear infinite; margin-bottom:16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
  <script>
    (async function() {
      const REPO = "4by4qa/menu";
      const FALLBACK = "https://doctor-theology-eternal-astrology.trycloudflare.com";
      const repoName = "/" + REPO.split("/")[1];
      let path = window.location.pathname;
      if (path.toLowerCase().startsWith(repoName.toLowerCase())) {
        path = path.slice(repoName.length);
      }
      if (!path || path === "/" || path === "/index.html") {
        const p = new URLSearchParams(window.location.search);
        const t = p.get("t") || "1";
        const k = p.get("k") || "";
        path = "/t/" + t + (k ? "?k=" + encodeURIComponent(k) : "");
      } else {
        path = path + window.location.search;
      }
      let base = FALLBACK;
      try {
        const r = await fetch("https://api.github.com/repos/" + REPO + "/contents/tunnel.json?ts=" + Date.now(), {
          headers: { "Accept": "application/vnd.github.raw+json" },
          cache: "no-store"
        });
        if (r.ok) {
          const d = await r.json();
          if (d && d.tunnel_url) base = d.tunnel_url.replace(/\/$/, "");
        }
      } catch (_) {}
      if (base) window.location.replace(base + path);
    })();
  </script>
</head>
<body>
  <div class="ring"></div>
  <div style="font-size:1.25rem;font-weight:900;color:#E68624;">4 X 4 Tourism &amp; Entertainment</div>
  <div style="font-size:0.9rem;color:#CBD5E1;margin-top:6px;">Opening Beach Menu... &bull; جاري فتح القائمة</div>
</body>
</html>
